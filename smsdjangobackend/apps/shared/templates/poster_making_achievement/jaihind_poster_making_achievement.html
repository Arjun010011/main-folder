<!DOCTYPE html>
<html>
<head>
  <title>Jaihind School Certificate</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Zilla+Slab">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway:700">
  <style>
    /* Setting A4 landscape dimensions */
    @page {
      size: 315mm 210mm; /* A4 dimensions in landscape */
      margin: 0;
    }

    body {
      margin: 0;
      font-family: 'Raleway', sans-serif;
      color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .certificate-container {
      width: 315mm; /* A4 landscape width */
      height: 210mm; /* A4 landscape height */
      position: relative;
      background: url('https://production-edubricz.s3.amazonaws.com/18/Achievement_1_6.jpg') no-repeat center center;
      background-size: contain;
      box-sizing: border-box;
      text-align: center;
    }

    /* Styling for student photo */
    .student-photo {
      display: block;
      margin: 245px auto 20px; /* Adjust margin for spacing */
      width: 155px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #fff;
    }

    /* Styling for student name and description */
    .student-name {
      font-family: 'Raleway', sans-serif;
      font-size: 32px;
      font-weight: bold;
      margin-top: 10px;
      color: #a10000;
    }

    .student-description {
      font-family: 'Zilla Slab', serif;
      font-size: 28px;
      margin-top: 10px;
      color: #090c0f;
      padding-left: 20%;
      padding-right: 20%;
      text-align: center;
      /* font-weight: bold; */
    }
  </style>
</head>
<body>
    <div class="certificate-container">
      <div style="top: 230px;">
      <!-- Placeholder for student photo -->
      <img class="student-photo" src="{{profile_pic_details}}" alt="Student Photo">
      <div class="student-description">This is proudly awarded to</div>
      
      <!-- Student name -->
      <div class="student-name">{{student_full_name}}</div>
  
      <!-- Student description -->
      <div class="student-description">
        of grade <span style="color: red;">{{standard_name | cut:"Standard"}}{{standard_suffix}} {{academic_year}}</span> 
        for securing the  <span style="color: red;">{{rank}}</span> Prize <br>
        in the <span style="color: red;">Poster Making Competition</span>
        held as part of the Environment Day Celebration on <span style="color: red;">{{event_date}}</span>
    </div>
    </div>
  </div>
  </body>
</html>
