<!DOCTYPE html>
<html>
<head>
<title>AIPS Id Card</title>
<style>
  @page {
    size: 54mm 85mm;
    margin: 0px;
    width: 100%;
    height: 100%;
    border: none;
  }
  body {
    margin: 0px;
    color: #0A0A0A;
    font-family: Raleway;
  }
  .page {
    width: 54mm;
    height: 85mm;
    background-size: cover;
  }
  .front-side {
    background-image: url("https://staging-s3-23.s3.amazonaws.com/18/gurukul_templet_ID_FNT_2_1.jpg");
    background-repeat: no-repeat;
    background-size: 54mm 85mm;
  }
  
  @font-face {
    font-family: 'umberland slab';
    src: url("https://edubricz-production.s3.ap-south-1.amazonaws.com/backend-datas/fontfamilies/Umberland%2BSlab_D.otf");
  }
  .username {
    color: #000000;
    min-width: 100%;
    font-size: 12px;
    font-weight: bold;
    margin-top: 48%;
    text-align: center;
  }
</style>
</head>
<body>
  {%for staff in data %}
  <!-- Front side of the ID card -->
  <div class="page front-side">
    <div style="padding-top: 100px;">
        <div style="height: 85px; width:79px;right:3px;border:0.5px solid white;background-color: white;margin:auto;border-radius: 15%;">
          <img src={{staff.profile_pic_details.file}} style="height: 83px; width: 77px;border:0.5px solid #000000;border-radius: 15%;">
        </div>
        <div style="color:#000000;text-align: center;font-size: 11.5px;font-weight: bold;margin-top: 5px;"> {{ staff.name|upper }}</div>
        <div style="color:#000000;text-align: center;font-size: 11.5px;font-weight: bold;margin-top: 3.5px;">Teacher</div>
        <div style="color:#000000;text-align: center;font-size: 11.5px;font-weight: bold;margin-top: 3.5px;"> D.O.B : {{staff.dob_changed}}</div>
      </div> 

     


        <!-- <div style="color:#000000;text-align: center;font-size: 9px;font-weight: bold;margin-top: 4px;">Enroll : {{student.admission_num}}</div>
        <div style="color:#000000;text-align: center;font-size: 9px;font-weight: bold;margin-top: 2px;">2024-25</div>
        <div style="color:#000000;text-align: center;font-size: 11px;font-weight: bold;margin-top: 2px;">{{student.student_details.blood_group}}</div> -->
      


       
      </div>
  
 
  
  <!-- Back side of the ID card -->
  
  {% endfor %}
</body>
</html>
