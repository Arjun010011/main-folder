<!DOCTYPE html>
<html>
<head>
<title>AIPS Id Card</title>
<style>
  @page {
    size: 54mm 85mm;
    margin: 0px;
    width: 100%;
    height: 100%;
    border: none;
  }
  body {
    margin: 0px;
    color: #0A0A0A;
    font-family: Raleway;
  }
  .page {
    width: 54mm;
    height: 85mm;
    background-size: cover;
  }
  .front-side {
    background-image: url("https://staging-s3-23.s3.amazonaws.com/18/Akshara_templet_ID_FNT_5_1.jpg");
    background-repeat: no-repeat;
    background-size: 54mm 85mm;
  }
  @font-face {
    font-family: 'umberland slab';
    src: url("https://edubricz-production.s3.ap-south-1.amazonaws.com/backend-datas/fontfamilies/Umberland%2BSlab_D.otf");
  }
  .username {
    color: #000000;
    min-width: 100%;
    font-weight: bold;
    margin-top: 48%;
    text-align: center;
  }
  .box1 {
    width: 55px;
    height: 60px;
    border: 1.3px solid black;
  }
  .size {
    font-size: 10px;
  }
</style>
</head>
<body>
    {% for staff in data %}
  <!-- Front side of the ID card -->
  <div class="page front-side">
    <div style="padding-top: 104px;">
      <div style="height: 81px; width:79px;right:3px;border:1.5px solid #000000;background-color: white;margin:auto;">
        <img src="{{staff.profile_pic_details.file}}" style="height: 81px; width: 79px;">
      </div>
    </div>
    <table width="100%" style="top: 150px; margin-left: 15px; margin-top: 8px; font-size: 8px; line-height: 18px;">
      <tr>
        <td style="width: 30px;">NAME</td>
        <td> : </td>
        
        <td style="font-weight: bold;
          {% if staff.name|length > 20 %}font-size: 8px;
          {% elif staff.name|length > 13 %}font-size: 10px;
          {% else %}font-size: 10px;
          {% endif %}">  {{staff.name|upper}}</td>
      </tr> 
      <tr>
        <td>D E S</td>
        <td> : </td>
        
        <td style="font-size: 10px;font-weight: bold;">  {{staff.designation|upper }}</td>
      </tr>
      <tr>
        <td>AIS No</td>
        <td> : </td>
       
        <td style="font-size: 10px;font-weight: bold;"> {{staff.employee_id}}</td>
       
      </tr>
      
    </table>
  </div>
  {% endfor %}
</body>
</html>
