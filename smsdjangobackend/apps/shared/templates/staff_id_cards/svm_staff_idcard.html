<!DOCTYPE html>
<html>
<head>
<title>AIPS Id Card</title>
<style>
  @page {
    size: 54mm 85mm;
    margin: 0px;
    width: 100%;
    height: 100%;
    border: none;
  }
  body {
    margin: 0px;
    color: #0A0A0A;
    font-family: Raleway;
  }
  .page {
    width: 54mm;
    height: 85mm;
    background-size: cover;
  }
  .front-side {
    background-image: url("https://staging-s3-23.s3.amazonaws.com/18/Template_STAFF_ID_FNT_3_1.jpg");
    background-repeat: no-repeat;
    background-size: 54mm 85mm;
  }
  
  @font-face {
    font-family: 'umberland slab';
    src: url("https://edubricz-production.s3.ap-south-1.amazonaws.com/backend-datas/fontfamilies/Umberland%2BSlab_D.otf");
  }
  .username {
    color: #000000;
    min-width: 100%;
    font-size: 12px;
    font-weight: bold;
    margin-top: 48%;
    text-align: center;
  }
</style>
</head>
<body>
  {% for staff in data %}
  <!-- Front side of the ID card -->
  <div class="page front-side">
    <div style="padding-top: 104px;">
        <div style="height: 85px; width:79px;right:3px;border:1px solid white;background-color: white;margin:auto;border-radius: 50% 50%;">
          <img src={{staff.profile_pic_details.file}} style="height: 83px; width: 77px;border:1px solid #000000;border-radius: 50%;">
        </div>
        <div style="color:#000000;text-align: center;font-size: 11.5px;font-weight: bold;margin-top: 5px;">{{staff.name|upper}}</div>
        <!-- <div style="color:#000000;text-align: center;font-size: 11.5px;font-weight: bold;margin-top: 2px;">{{student.standard_name}}</div> -->
      </div> 

      <table width="100%" style=" font-size: 11.5px; color: #000000;color: #000000;font-weight: bold;margin-left: auto;margin-right: auto;line-height: 18px;">
        <tr>
          <td>D E S </td>
          <td>: {{staff.designation|upper}}</td>
        </tr>
        <tr>
          <td>PHONE NO</td>
          <td >: {{staff.mobile_num|cut:"+91"}}</td>
        </tr>
        <tr>
          <td>D.O.B</td>
          
          <td>:
            {{staff.dob_changed_format}}
          </td>
        </tr>
      
        
      </table>


        <!-- <div style="color:#000000;text-align: center;font-size: 9px;font-weight: bold;margin-top: 4px;">Enroll : {{student.admission_num}}</div>
        <div style="color:#000000;text-align: center;font-size: 9px;font-weight: bold;margin-top: 2px;">2024-25</div>
        <div style="color:#000000;text-align: center;font-size: 11px;font-weight: bold;margin-top: 2px;">{{student.student_details.blood_group}}</div> -->
      


       
      </div>
  
  <div style="page-break-after: always;"></div>
  
  <!-- Back side of the ID card -->
  
  {% endfor %}
</body>
</html>
