<!DOCTYPE html>
<html>
<head>
<title>AIPS Id Card</title>
<style>
  @page {
    size: 54mm 85mm;
    margin: 0px;
    width: 100%;
    height: 100%;
    border: none;
  }
  body {
    margin: 0px;
    color: #0A0A0A;
    font-family: Raleway;
  }
  .page {
    width: 54mm;
    height: 85mm;
    background-size: cover;
  }
  .front-side {
    background-image: url("https://staging-s3-23.s3.amazonaws.com/18/Akshara_templet_ID_FNT_3_6.jpg");
    background-repeat: no-repeat;
    background-size: 54mm 85mm;
  }
  @font-face {
    font-family: 'umberland slab';
    src: url("https://edubricz-production.s3.ap-south-1.amazonaws.com/backend-datas/fontfamilies/Umberland%2BSlab_D.otf");
  }
  .username {
    color: #000000;
    min-width: 100%;
    font-weight: bold;
    margin-top: 48%;
    text-align: center;
  }
  .box1 {
    width: 55px;
    height: 60px;
    border: 1.3px solid black;
  }
  .size {
    font-size: 10px;
  }
</style>
</head>
<body>
  {% for student in data %}
  <!-- Front side of the ID card -->
  <div class="page front-side">
    <div style="padding-top: 104px;">
      <div style="height: 83px; width:79px;right:3px;border:1.5px solid #000000;background-color: rgb(255, 255, 255);margin:auto;">
        <img src="{{student.profile_pic_details.file}}" style="height: 83px; width: 79px;">
      </div>
    </div>
    <table width="100%" style="top: 150px; margin-left: 22px; margin-top: 8px; font-size: 10px; font-weight: bold;line-height: 18px;margin-right: 4px;">
      <tr>
        <td>NAME</td>
        <td>:</td>
        <td style="
          {% if student.name|length > 20 %}font-size: 8px;
          {% elif student.name|length > 13 %}font-size: 10px;
          {% else %}font-size: 12px;
          {% endif %}">{{student.name|upper}}</td>
      </tr> 
      <tr>
        <td>HOUSE </td>
        <td>:</td>
        <td style="{% if student.house_name == 'Red' %}color: red; font-size: 13px{% elif student.house_name == 'Green' %}color: green; font-size: 13px{% elif student.house_name == 'Blue' %}color: blue; font-size: 13px{% elif student.house_name == 'Yellow' %}color: rgb(255, 251, 0); font-size: 13px{% endif %}"> {{student.house_name|upper}}</td>
      </tr>
      <tr>
        <td>ID NO </td>
        <td>:</td>
        <td style="font-size: 12px;"> {{student.admission_num}}</td>
      </tr>
    </table>
  </div>
  {% endfor %}
</body>
</html>
