<!DOCTYPE html>
<html lang="en" manifest="/app.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/%REACT_APP_ENV%.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"> -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->

    <!-- First load Google Maps library -->
    <script id="myScript"></script>

    <!-- <script>
    var url = "https://maps.googleapis.com/maps/api/js?key=";
    var key = "AIzaSyByMpZcBmce4H-U0gq0y6Wk_gWJ9r-_1ig";

    if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
      key = "AIzaSyByMpZcBmce4H-U0gq0y6Wk_gWJ9r-_1ig";
    }
    document.getElementById('myScript').src = url + key + extra;
  </script>  -->

    <!-- Then load your bundle file -->

    <title>%REACT_APP_ENV%</title>
    <script>
      UPLOADCARE_PUBLIC_KEY = "demopublickey";
    </script>
  </head>

  <body>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <script src="https://code.highcharts.com/modules/export-data.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>

    <script
      src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"
      charset="utf-8"
    ></script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB6wSWAr6mBzpnlYCirOjZkUDExOMMhyKk&libraries=places"></script> -->
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    <script
      async
      defer
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyByMpZcBmce4H-U0gq0y6Wk_gWJ9r-_1ig&libraries=places"
    >
            if (process.env.REACT_APP_ENV==="edubricz") {
          $("link[rel=icon]").attr("href", "%PUBLIC_URL%/edubricz.ico");
      } else {
          $("link[rel=icon]").attr("href", "%IMAGES%/brainova_new.jpg");
      }
    </script>
  </body>
</html>
